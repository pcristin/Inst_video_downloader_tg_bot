services:
  instagram-video-bot:
    build: .
    container_name: instagram-video-bot
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    env_file:
      - .env
    volumes:
      # Mount temp directory for video downloads
      - ./temp:/app/temp
      # Mount sessions directory to persist instagrapi sessions
      - ./sessions:/app/sessions
      # Mount logs directory (optional)
      - ./logs:/app/logs
      # Mount accounts file for multi-account support
      - ./accounts.txt:/app/accounts.txt:ro
      # Mount accounts state directory to persist banned/usage status
      - ./account-state:/app/account-state
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
      - source: instagram_auth
        target: instagram_auth.json
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      # Override paths to use container paths
      - TEMP_DIR=/app/temp
      - ACCOUNT_STATE_FILE=/app/account-state/accounts_state.json
      # Optional, when the read-only mount above is enabled:
      - IG_AUTH_COOKIES_FILE=/run/secrets/instagram_auth.json
      - BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      # Additional environment variables for container
      - TZ=UTC
      - HOME=/tmp
      - UV_CACHE_DIR=/tmp/uv-cache
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=1000,gid=1000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Health check
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-m", "src.instagram_video_bot.utils.health_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  instagram_auth:
    file: ./secrets/instagram_auth.json
